server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /srv/rhaomi/public/current;

    location = /release-manifest.json {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
