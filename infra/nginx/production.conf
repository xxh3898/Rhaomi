log_format rhaomi_access '$remote_addr - [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    root /srv/rhaomi/public/current;

    access_log /dev/stdout rhaomi_access;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 ipv6=off valid=5s;

    add_header X-Content-Type-Options "nosniff" always;

    location = /release-manifest.json {
        return 404;
    }

    location = /api/build {
        return 404;
    }

    location ^~ /api/build/ {
        return 404;
    }

    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location = /actuator {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location ^~ /api/admin/ {
        set $rhaomi_backend http://backend:8080;
        proxy_pass $rhaomi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 21m;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/ {
        return 404;
    }

    location = /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 308 /admin/;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /generated/media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
