name: 기능 개발
description: 고객 화면, CMS, SEO 또는 운영 기능을 구현합니다.
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        한 PR로 완료 가능한 크기로 작성합니다. 범위가 크면 먼저 분할합니다.
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 현재 어떤 사용자·운영 문제가 있는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 기대 결과
      description: 완료 후 관찰 가능한 결과를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 포함 범위
      placeholder: |
        - 
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: 제외 범위
      placeholder: |
        - 
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준
      placeholder: |
        - [ ] Given / When / Then
    validations:
      required: true
  - type: checkboxes
    id: contracts
    attributes:
      label: 계약 영향
      options:
        - label: URL/라우트
        - label: Directus 스키마 또는 권한
        - label: SEO/메타데이터
        - label: 배포/백업/보안
        - label: 영향 없음
  - type: textarea
    id: validation
    attributes:
      label: 검증 계획
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: 동기화할 문서
    validations:
      required: true
