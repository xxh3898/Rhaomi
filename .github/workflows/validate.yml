name: Validate

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 타입 검사
        run: npm run typecheck

      - name: Contract test
        run: npm test

      - name: Static Export build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: 정적 산출물 검증
        run: npm run validate:export

  cms-compose:
    name: CMS Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CI용 local 환경파일 준비
        run: cp .env.example .env.dev.local

      - name: Compose health와 persistence 검증
        run: sh scripts/validate-cms-compose.sh .env.dev.local
