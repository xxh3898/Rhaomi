spring:
  application:
    name: rhaomi-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: RHAOMI_SESSION
        http-only: true
        secure: ${RHAOMI_SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

rhaomi:
  bootstrap-admin:
    enabled: ${RHAOMI_BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${RHAOMI_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${RHAOMI_BOOTSTRAP_ADMIN_PASSWORD:}
