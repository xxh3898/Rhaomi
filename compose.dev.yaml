name: ${RHAOMI_COMPOSE_PROJECT_NAME:-dev-rhaomi}

services:
  frontend:
    image: node:24.20.0-alpine3.23@sha256:0388af2af070cd4736a1567cfed02469ba117848845b4165d87a333edb53d2ca
    profiles: ["frontend"]
    init: true
    working_dir: /workspace
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/node_modules
      - frontend-npm-cache:/root/.npm
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - frontend-local

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    image: dev-rhaomi-backend:java25-libheif-1.23.0
    init: true
    working_dir: /workspace/backend
    command: ["./gradlew", "bootRun", "--no-daemon"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RHAOMI_SESSION_COOKIE_SECURE: ${RHAOMI_SESSION_COOKIE_SECURE:-false}
      RHAOMI_TEST_DATABASE_ALLOWED: ${RHAOMI_TEST_DATABASE_ALLOWED:-false}
      RHAOMI_BOOTSTRAP_ADMIN_ENABLED: ${RHAOMI_BOOTSTRAP_ADMIN_ENABLED:-false}
      RHAOMI_BOOTSTRAP_ADMIN_EMAIL: ${RHAOMI_BOOTSTRAP_ADMIN_EMAIL:-}
      RHAOMI_BOOTSTRAP_ADMIN_PASSWORD: ${RHAOMI_BOOTSTRAP_ADMIN_PASSWORD:-}
      RHAOMI_MEDIA_ROOT: ${RHAOMI_MEDIA_ROOT:-/var/lib/rhaomi/media}
    volumes:
      - ./backend:/workspace/backend
      - backend-gradle-cache:/root/.gradle
      - backend-media-masters:/var/lib/rhaomi/media
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend-internal
      - backend-local
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  postgres:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  smoke:
    image: node:24.20.0-alpine3.23@sha256:0388af2af070cd4736a1567cfed02469ba117848845b4165d87a333edb53d2ca
    profiles: ["smoke"]
    init: true
    working_dir: /workspace
    command: ["node", "scripts/validate-backend-auth.mjs", "http://backend:8080"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      RHAOMI_BOOTSTRAP_ADMIN_EMAIL: ${RHAOMI_BOOTSTRAP_ADMIN_EMAIL:-}
      RHAOMI_BOOTSTRAP_ADMIN_PASSWORD: ${RHAOMI_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./backend/src/test/resources/media:/workspace/media-fixtures:ro
    networks:
      - backend-internal

volumes:
  frontend-node-modules:
    name: ${RHAOMI_COMPOSE_VOLUME_PREFIX:-dev-rhaomi}-frontend-node-modules
  frontend-npm-cache:
    name: ${RHAOMI_COMPOSE_VOLUME_PREFIX:-dev-rhaomi}-frontend-npm-cache
  backend-gradle-cache:
    name: ${RHAOMI_COMPOSE_VOLUME_PREFIX:-dev-rhaomi}-backend-gradle-cache
  backend-media-masters:
    name: ${RHAOMI_COMPOSE_VOLUME_PREFIX:-dev-rhaomi}-backend-media-masters
  postgres-data:
    name: ${RHAOMI_COMPOSE_VOLUME_PREFIX:-dev-rhaomi}-postgres-18-backend-data

networks:
  frontend-local:
    name: ${RHAOMI_COMPOSE_NETWORK_PREFIX:-dev-rhaomi}-frontend-local
  backend-local:
    name: ${RHAOMI_COMPOSE_NETWORK_PREFIX:-dev-rhaomi}-backend-local
  backend-internal:
    name: ${RHAOMI_COMPOSE_NETWORK_PREFIX:-dev-rhaomi}-backend-internal
    internal: true
