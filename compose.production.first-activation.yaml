name: ${RHAOMI_FIRST_ACTIVATION_RECOVERY_PROJECT:?RHAOMI_FIRST_ACTIVATION_RECOVERY_PROJECT is required}

x-first-activation-logging: &first-activation-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  first-activation-backup-verifier:
    profiles: ["first-activation-recovery"]
    image: ${RHAOMI_PRODUCTION_IMAGE:?RHAOMI_PRODUCTION_IMAGE is required}
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    working_dir: /opt/rhaomi
    entrypoint: ["/usr/local/bin/rhaomi-backup-verifier"]
    command: ["verify-backup-set", "invalid-until-fixed-argv-overrides-it"]
    environment:
      RHAOMI_BACKUP_REPOSITORY_ROOT: /var/lib/rhaomi/backup-repository
    volumes:
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_BACKUP_REPOSITORY:?RHAOMI_FIRST_ACTIVATION_BACKUP_REPOSITORY is required}
        target: /var/lib/rhaomi/backup-repository
        read_only: true
        bind:
          create_host_path: false
    network_mode: none
    restart: "no"
    logging: *first-activation-logging

  first-activation-media-restore:
    profiles: ["first-activation-recovery"]
    image: ${RHAOMI_PRODUCTION_IMAGE:?RHAOMI_PRODUCTION_IMAGE is required}
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    working_dir: /opt/rhaomi
    command: ["node", "/opt/rhaomi/source/scripts/rhaomi-backup-tool.mjs"]
    environment:
      RHAOMI_BACKUP_REPOSITORY_ROOT: /var/lib/rhaomi/backup-repository
      RHAOMI_BACKUP_RESTORE_MEDIA_ROOT: /var/lib/rhaomi/restore-media
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_BACKUP_REPOSITORY:?RHAOMI_FIRST_ACTIVATION_BACKUP_REPOSITORY is required}
        target: /var/lib/rhaomi/backup-repository
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT:?RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT is required}/media
        target: /var/lib/rhaomi/restore-media
        bind:
          create_host_path: false
    network_mode: none
    restart: "no"
    logging: *first-activation-logging

  first-activation-postgres:
    profiles: ["first-activation-recovery"]
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${RHAOMI_POSTGRES_DB:?RHAOMI_POSTGRES_DB is required}
      POSTGRES_USER: ${RHAOMI_POSTGRES_USER:?RHAOMI_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${RHAOMI_POSTGRES_PASSWORD:?RHAOMI_POSTGRES_PASSWORD is required}
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=1024m
    networks:
      - first-activation-data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 1m
    logging: *first-activation-logging

  first-activation-schema-validate:
    profiles: ["first-activation-recovery"]
    image: ${RHAOMI_PRODUCTION_IMAGE:?RHAOMI_PRODUCTION_IMAGE is required}
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    working_dir: /opt/rhaomi
    command:
      [
        "java",
        "-jar",
        "/opt/rhaomi/backend.jar",
        "--rhaomi.production-task=schema-validate",
      ]
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://first-activation-postgres:5432/${RHAOMI_POSTGRES_DB:?RHAOMI_POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${RHAOMI_POSTGRES_USER:?RHAOMI_POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${RHAOMI_POSTGRES_PASSWORD:?RHAOMI_POSTGRES_PASSWORD is required}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      RHAOMI_BOOTSTRAP_ADMIN_ENABLED: "false"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks:
      - first-activation-data
    restart: "no"
    logging: *first-activation-logging

  first-activation-backend:
    profiles: ["first-activation-recovery"]
    image: ${RHAOMI_PRODUCTION_IMAGE:?RHAOMI_PRODUCTION_IMAGE is required}
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    working_dir: /opt/rhaomi
    command: ["java", "-jar", "/opt/rhaomi/backend.jar"]
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://first-activation-postgres:5432/${RHAOMI_POSTGRES_DB:?RHAOMI_POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${RHAOMI_POSTGRES_USER:?RHAOMI_POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${RHAOMI_POSTGRES_PASSWORD:?RHAOMI_POSTGRES_PASSWORD is required}
      SPRING_FLYWAY_ENABLED: "false"
      RHAOMI_SESSION_COOKIE_SECURE: "true"
      RHAOMI_BOOTSTRAP_ADMIN_ENABLED: "false"
      RHAOMI_ADMIN_WEBAUTHN_REQUIRED: "true"
      RHAOMI_WEBAUTHN_RP_ID: ${RHAOMI_WEBAUTHN_RP_ID:?RHAOMI_WEBAUTHN_RP_ID is required}
      RHAOMI_WEBAUTHN_ORIGIN: ${RHAOMI_WEBAUTHN_ORIGIN:?RHAOMI_WEBAUTHN_ORIGIN is required}
      RHAOMI_WEBAUTHN_RP_NAME: ${RHAOMI_WEBAUTHN_RP_NAME:?RHAOMI_WEBAUTHN_RP_NAME is required}
      RHAOMI_WEBAUTHN_CHALLENGE_TTL: "5m"
      RHAOMI_BUILD_SERVICE_TOKEN: ${RHAOMI_BUILD_SERVICE_TOKEN:?RHAOMI_BUILD_SERVICE_TOKEN is required}
      RHAOMI_MEDIA_ROOT: /var/lib/rhaomi/media
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT:?RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT is required}/media
        target: /var/lib/rhaomi/media
        bind:
          create_host_path: false
    networks:
      first-activation-build:
        aliases: ["backend"]
      first-activation-data:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    logging: *first-activation-logging

  first-activation-publisher:
    profiles: ["first-activation-recovery"]
    image: ${RHAOMI_PRODUCTION_IMAGE:?RHAOMI_PRODUCTION_IMAGE is required}
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    working_dir: /opt/rhaomi
    command:
      [
        "java",
        "-jar",
        "/opt/rhaomi/backend.jar",
        "--rhaomi.publisher.mode=control-loop",
      ]
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://first-activation-postgres:5432/${RHAOMI_POSTGRES_DB:?RHAOMI_POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${RHAOMI_POSTGRES_USER:?RHAOMI_POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${RHAOMI_POSTGRES_PASSWORD:?RHAOMI_POSTGRES_PASSWORD is required}
      SPRING_FLYWAY_ENABLED: "false"
      RHAOMI_PUBLISHER_OWNER: first-activation-recovery
      RHAOMI_PUBLISHER_AUTO_START: "true"
      RHAOMI_PUBLISHER_LOCK_FILE: /var/lib/rhaomi/locks/publisher.lock
      RHAOMI_PUBLISHER_NODE_EXECUTABLE: /usr/local/bin/node
      RHAOMI_PUBLISHER_RELEASE_SCRIPT: /opt/rhaomi/source/scripts/publish-static-release.mts
      RHAOMI_PUBLISHER_SOURCE_ROOT: /opt/rhaomi/source
      RHAOMI_PUBLISHER_WORK_ROOT: /var/lib/rhaomi/publisher
      RHAOMI_PUBLIC_RELEASE_ROOT: /srv/rhaomi/public/releases
      RHAOMI_PUBLIC_CURRENT_LINK: /srv/rhaomi/public/current
      RHAOMI_PUBLIC_PREVIOUS_LINK: /srv/rhaomi/public/previous
      BUILD_API_INTERNAL_URL: http://first-activation-backend:8080
      BUILD_API_CREDENTIAL: ${RHAOMI_BUILD_SERVICE_TOKEN:?RHAOMI_BUILD_SERVICE_TOKEN is required}
      PUBLIC_SITE_URL: ${RHAOMI_PUBLIC_SITE_URL:?RHAOMI_PUBLIC_SITE_URL is required}
      RHAOMI_CODE_SHA: ${RHAOMI_CODE_SHA:?RHAOMI_CODE_SHA is required}
      RHAOMI_CODE_IMAGE_TAG: ${RHAOMI_CODE_IMAGE_TAG:?RHAOMI_CODE_IMAGE_TAG is required}
      RHAOMI_CODE_IMAGE_DIGEST: ${RHAOMI_CODE_IMAGE_DIGEST:?RHAOMI_CODE_IMAGE_DIGEST is required}
      RHAOMI_FLYWAY_VERSION: ${RHAOMI_FLYWAY_VERSION:?RHAOMI_FLYWAY_VERSION is required}
      RHAOMI_SBOM_REFERENCE: ${RHAOMI_SBOM_REFERENCE:?RHAOMI_SBOM_REFERENCE is required}
      RHAOMI_PUBLISHER_BUILD_TIMEOUT_MS: "600000"
      RHAOMI_RELEASE_RETENTION: "5"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT:?RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT is required}/public
        target: /srv/rhaomi/public
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT:?RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT is required}/media
        target: /var/lib/rhaomi/media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT:?RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT is required}/state/publisher
        target: /var/lib/rhaomi/publisher
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT:?RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT is required}/state/publisher/build-workspace
        target: /opt/rhaomi/source/.rhaomi-publication-work
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT:?RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT is required}/state/locks
        target: /var/lib/rhaomi/locks
        bind:
          create_host_path: false
    networks:
      - first-activation-build
      - first-activation-data
    stop_grace_period: 30s
    logging: *first-activation-logging

  first-activation-static:
    profiles: ["first-activation-recovery"]
    image: nginx:1.31.4-alpine3.24@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    init: true
    user: "101:101"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,uid=101,gid=101,mode=0750
      - /var/run:rw,noexec,nosuid,size=8m,uid=101,gid=101,mode=0750
      - /tmp:rw,noexec,nosuid,size=8m,uid=101,gid=101,mode=0750
    volumes:
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_APP_ROOT:?RHAOMI_FIRST_ACTIVATION_APP_ROOT is required}/nginx/production.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT:?RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT is required}/public
        target: /srv/rhaomi/public
        read_only: true
        bind:
          create_host_path: false
    networks:
      - first-activation-public
      - first-activation-build
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    logging: *first-activation-logging

  first-activation-smoke:
    profiles: ["first-activation-recovery"]
    image: ${RHAOMI_PRODUCTION_IMAGE:?RHAOMI_PRODUCTION_IMAGE is required}
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/usr/local/bin/rhaomi-first-activation-smoke"]
    command: ["http://first-activation-static:8080", "${RHAOMI_FIRST_ACTIVATION_PROBE_MARKER:?RHAOMI_FIRST_ACTIVATION_PROBE_MARKER is required}"]
    volumes:
      - type: bind
        source: ${RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT:?RHAOMI_FIRST_ACTIVATION_RECOVERY_ROOT is required}/public
        target: /srv/rhaomi/public
        read_only: true
        bind:
          create_host_path: false
    networks:
      - first-activation-public
      - first-activation-build
    restart: "no"
    logging: *first-activation-logging

networks:
  first-activation-public:
    internal: true
  first-activation-build:
    internal: true
  first-activation-data:
    internal: true
