x-validation-labels: &validation-labels
  io.homeserver.cleanup.environment: development
  io.homeserver.cleanup.project: rhaomi
  io.homeserver.cleanup.task: ${RHAOMI_CLEANUP_TASK:?RHAOMI_CLEANUP_TASK is required}
  io.homeserver.cleanup.lifecycle: task
  io.homeserver.cleanup.retain: "false"
  io.homeserver.cleanup.git-head: ${RHAOMI_CLEANUP_GIT_HEAD:?RHAOMI_CLEANUP_GIT_HEAD is required}

services:
  rhaomi-web:
    labels: *validation-labels
    volumes:
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/app/nginx/production.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/public
        target: /srv/rhaomi/public
        read_only: true
        bind:
          create_host_path: false

  backend:
    labels: *validation-labels
    volumes:
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/data/media
        target: /var/lib/rhaomi/media
        bind:
          create_host_path: false

  publisher:
    labels: *validation-labels
    volumes:
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/public
        target: /srv/rhaomi/public
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/data/media
        target: /var/lib/rhaomi/media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/state/publisher
        target: /var/lib/rhaomi/publisher
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/state/publisher/build-workspace
        target: /opt/rhaomi/source/.rhaomi-publication-work
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/state/locks
        target: /var/lib/rhaomi/locks
        bind:
          create_host_path: false

  migration:
    labels: *validation-labels

  schema-validate:
    labels: *validation-labels

  backup-tool:
    labels: *validation-labels
    environment:
      RHAOMI_BACKUP_RESTORE_MEDIA_ROOT: /var/lib/rhaomi/restore-media
    volumes:
      - type: bind
        source: ${RHAOMI_BACKUP_REPOSITORY_ROOT:?RHAOMI_BACKUP_REPOSITORY_ROOT is required}
        target: /var/lib/rhaomi/backup-repository
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/data/media
        target: /var/lib/rhaomi/media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/state/deploy
        target: /var/lib/rhaomi/deploy-state
        bind:
          create_host_path: false
      - type: bind
        source: ${RHAOMI_BACKUP_RESTORE_MEDIA_ROOT:?RHAOMI_BACKUP_RESTORE_MEDIA_ROOT is required}
        target: /var/lib/rhaomi/restore-media
        bind:
          create_host_path: false

  backup-permission:
    profiles: ["production-backup"]
    image: ${RHAOMI_PRODUCTION_IMAGE:?RHAOMI_PRODUCTION_IMAGE is required}
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    entrypoint: ["/usr/local/bin/rhaomi-backup-media-permissions"]
    command: ["assert-runtime", "0", "0"]
    labels: *validation-labels
    volumes:
      - type: bind
        source: ${RHAOMI_PRODUCTION_VALIDATION_ROOT:?RHAOMI_PRODUCTION_VALIDATION_ROOT is required}/data/media
        target: /var/lib/rhaomi/media-permissions
        bind:
          create_host_path: false

  postgres:
    labels: *validation-labels

volumes:
  postgres-data:
    labels: *validation-labels

networks:
  loopback-edge:
    labels: *validation-labels
  web-backend:
    labels: *validation-labels
  build-internal:
    labels: *validation-labels
  data-internal:
    labels: *validation-labels
